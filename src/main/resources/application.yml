spring:
  application:
    name: socket
  kafka:
    bootstrap-servers: localhost:9092   # Kafka chạy bằng docker compose trong infra
    producer:
      properties:
        # Kafka không kết nối được thì send() chỉ chờ tối đa 3s (mặc định 60s), tránh treo luồng WebSocket
        max.block.ms: 3000
  profiles:
    active: dev

server:
  port: 8084

app:
  websocket:
    path: /ws
    allowed-origins: "*"

spring.cloud.openfeign.client.config.character-service:
  # Gọi character-service lúc người chơi vào game: chờ lâu sẽ làm người chơi đứng yên, nên timeout ngắn
  connect-timeout: 2000
  read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

game:
  position-save:
    interval-ms: 5000   # chu kỳ gửi vị trí đã thay đổi sang character-service
  maps:
    # Mỗi id đọc từ classpath:maps/{id}.json (Tiled JSON do game-ui/tools/generate-tilemap.mjs sinh, chạy npm run maps:sync).
    # Liệt kê tường minh vì liệt kê thư mục classpath trong jar không đáng tin.
    ids: village,meadow
    # Map cho nhân vật mới, dữ liệu cũ (map_id null) hoặc map đã lưu không còn tồn tại.
    default-map: village
